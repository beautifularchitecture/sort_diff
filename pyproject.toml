[project]
name = "sorting-core"
version = "0.1.0"
description = "In-process sorting core: bubble, selection, and quick sort with step counting and accuracy checks."
requires-python = ">=3.12"

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

